<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Housewarming Invitation</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background-color: #f4f6f8; color: #333; line-height: 1.6; padding: 20px; }
        .card { max-width: 500px; margin: 20px auto; background: #ffffff; padding: 30px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); text-align: center; }
        h1 { color: #1a365d; font-size: 1.8rem; margin-bottom: 8px; }
        .subtitle { color: #718096; font-size: 1rem; margin-bottom: 24px; }
        .details { background: #edf2f7; padding: 16px; border-radius: 8px; margin-bottom: 24px; text-align: left; }
        .details p { margin-bottom: 8px; font-size: 0.95rem; }
        .qr-section { margin-top: 20px; }
        .qr-section img { max-width: 220px; width: 100%; height: auto; border-radius: 12px; border: 1px solid #e2e8f0; padding: 8px; background: #fff; }
        .footer-note { margin-top: 20px; font-size: 0.85rem; color: #a0aec0; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Housewarming Ceremony</h1>
        <p class="subtitle">We request the pleasure of your company!</p>
        
        <div class="details">
            <p><strong>📅 Date:</strong> Sunday, September 13, 2026</p>
            <p><strong>📍 Venue:</strong> Madipakkam, Chennai</p>
        </div>

        <div class="qr-section">
            <p><strong>Scan for Location:</strong></p>
            <img src="location-qr.png" alt="Location QR Code">
        </div>

        <p class="footer-note">Looking forward to seeing you there!</p>
    </div>
</body>
</html>
